services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://mentodo:mentodo@db:5432/mentodo
    depends_on:
      - db
    env_file:
      - ./backend/.env

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mentodo
      POSTGRES_PASSWORD: mentodo
      POSTGRES_DB: mentodo
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
