<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin zoom de ningún tipo (como Puchi): maximum-scale=1 evita el zoom de
         iOS al enfocar un campo con letra de menos de 16px; el doble toque lo
         quita touch-action y el pellizco, el bloqueo de gesturestart en main.jsx
         (Safari ignora user-scalable=no). interactive-widget: el teclado
         encoge el viewport en vez de tapar el contenido. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f8f6f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Favicon en PNG, no SVG: iOS no sabe usar un SVG para la pantalla de
         inicio y, si lo elige, pone una letra gris -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png" />
    <!-- Icono de la pantalla de inicio en iPhone/iPad. iOS lo guarda por URL
         y no lo vuelve a pedir: para cambiarlo, usar un nombre de archivo nuevo -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/app-180.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icons/app-180.png" />
    <meta name="apple-mobile-web-app-title" content="Mentodo" />
    <meta name="application-name" content="Mentodo" />
    <title>Mentodo</title>
    <script>
      // Aplica tema y color guardados antes de pintar nada: sin esto, cada
      // carga parpadea en claro antes de que llegue el perfil del servidor.
      try {
        var p = JSON.parse(localStorage.getItem('mentodo:look') || '{}')
        var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.accent = p.accent || 'bosque'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
